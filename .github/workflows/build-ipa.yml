name: Build iOS app

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          chmod +x scripts/xcodebuild-ci.sh
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | first | .udid')
          echo "Testing on simulator $UDID"
          scripts/xcodebuild-ci.sh test.log test \
            -project HomeLand.xcodeproj \
            -scheme HomeLand \
            -destination "id=$UDID"

      - name: Build unsigned IPA
        run: |
          scripts/xcodebuild-ci.sh build.log build \
            -project HomeLand.xcodeproj \
            -scheme HomeLand \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP_PATH="build/Build/Products/Release-iphoneos/HomeLand.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry HomeLand.ipa Payload
          ls -lh HomeLand.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeLand-ipa
          path: HomeLand.ipa
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
          if-no-files-found: ignore

      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HomeLand.ipa \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --latest \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Download HomeLand.ipa below and install it with Sideloadly or AltStore. See the README for step-by-step instructions."
